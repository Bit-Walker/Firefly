[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edbg-sdk"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = false
