[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edbg-cli"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["edbg-sdk==0.1.0"]

[project.scripts]
edbg = "edbg_cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = false
