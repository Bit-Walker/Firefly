[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edbg-control-plane"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi==0.136.1", "uvicorn==0.34.3", "edbg-analysis==0.1.0", "jsonschema>=4.24,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = false
