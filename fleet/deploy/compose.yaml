services:
  api:
    build:
      context: ../..
      dockerfile: fleet/deploy/Dockerfile
    restart: unless-stopped
    volumes:
      - fleet_data:/data
    networks: [fleet]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      FLEET_DOMAIN: ${FLEET_DOMAIN:?Set FLEET_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [fleet]
    depends_on: [api]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  fleet:
volumes:
  fleet_data:
  caddy_data:
  caddy_config:
